services:
  - type: web
    name: tennismate
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: "0508716669"
      - key: DATABASE_URL
        fromDatabase:
          name: tennismate-db
          property: connectionString

databases:
  - name: tennismate-db
    plan: free
    databaseName: tennismate
    user: tennismate
